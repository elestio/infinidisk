<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="440" viewBox="0 0 1440 440" role="img" aria-labelledby="title desc">
  <title id="title">InfiniDisk</title>
  <desc id="desc">Local speed. An S3-backed foundation. Linux block storage built in Rust, with a local WAL and asynchronous S3 checkpoints.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#07191f"/><stop offset=".52" stop-color="#0b1222"/><stop offset="1" stop-color="#1c1533"/></linearGradient>
    <linearGradient id="ink" x1="0" y1="0" x2="1" y2=".3"><stop stop-color="#5ce9cb"/><stop offset=".48" stop-color="#7addf5"/><stop offset="1" stop-color="#b59bff"/></linearGradient>
    <linearGradient id="light" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#fff"/><stop offset="1" stop-color="#c9e7e9"/></linearGradient>
    <radialGradient id="halo"><stop stop-color="#59dcd0" stop-opacity=".11"/><stop offset="1" stop-color="#59dcd0" stop-opacity="0"/></radialGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#93bcc8" stroke-opacity=".07"/></pattern>
  </defs>
  <rect width="1440" height="440" rx="24" fill="url(#bg)"/>
  <rect width="1440" height="440" rx="24" fill="url(#grid)"/>
  <ellipse cx="1070" cy="205" rx="350" ry="245" fill="url(#halo)"/>
  <path d="M0 439H1440" stroke="url(#ink)" stroke-width="2"/>
  <g font-family="DejaVu Sans, Arial, sans-serif">
    <circle cx="67" cy="61" r="5" fill="#5ce9cb"/>
    <text x="85" y="67" fill="#9cbbc5" font-size="16" letter-spacing="3">LINUX BLOCK STORAGE / BUILT IN RUST</text>
    <text x="58" y="182" fill="url(#light)" font-size="104" font-weight="700" letter-spacing="-5">InfiniDisk<tspan fill="#62e6cf">.</tspan></text>
    <text x="64" y="243" fill="#d8e5ed" font-size="30" font-weight="400">Local speed. An S3-backed foundation.</text>
    <text x="65" y="281" fill="#9bb0c0" font-size="18">Your filesystem. Your database. A new storage engine.</text>
    <g font-size="13" letter-spacing="1.4" font-weight="600">
      <rect x="64" y="329" width="152" height="38" rx="19" fill="#153132" stroke="#28524c"/>
      <text x="140" y="353" text-anchor="middle" fill="#74efd0">LOCAL WAL</text>
      <rect x="229" y="329" width="167" height="38" rx="19" fill="#132b36" stroke="#284754"/>
      <text x="312" y="353" text-anchor="middle" fill="#90dff6">NBD + UBLK</text>
      <rect x="409" y="329" width="202" height="38" rx="19" fill="#24213e" stroke="#423859"/>
      <text x="510" y="353" text-anchor="middle" fill="#c7b5ff">S3 CHECKPOINTS</text>
    </g>
    <g fill="none" stroke="url(#ink)" stroke-linecap="round">
      <ellipse cx="1113" cy="224" rx="224" ry="137" stroke-width="1" opacity=".12"/>
      <ellipse cx="1113" cy="224" rx="196" ry="113" stroke-width="1" opacity=".16"/>
      <path d="M1110 222C1065 151 1026 127 982 148C934 171 936 247 978 275C1026 306 1074 264 1110 222C1148 178 1192 136 1241 166C1284 193 1286 267 1240 291C1193 315 1154 289 1110 222Z" stroke-width="35" opacity=".045"/>
      <path d="M1110 222C1065 151 1026 127 982 148C934 171 936 247 978 275C1026 306 1074 264 1110 222C1148 178 1192 136 1241 166C1284 193 1286 267 1240 291C1193 315 1154 289 1110 222Z" stroke-width="17" opacity=".13"/>
      <path d="M1110 222C1065 151 1026 127 982 148C934 171 936 247 978 275C1026 306 1074 264 1110 222C1148 178 1192 136 1241 166C1284 193 1286 267 1240 291C1193 315 1154 289 1110 222Z" stroke-width="5.5"/>
    </g>
    <circle cx="976" cy="151" r="7" fill="#62e6cf"/><circle cx="1250" cy="284" r="7" fill="#b59bff"/>
    <path d="M976 130V91H930M1250 306V357H1298" fill="none" stroke="#698c9c" stroke-opacity=".65"/>
    <text x="918" y="96" text-anchor="end" fill="#82cdbd" font-size="13" letter-spacing="2">SSD</text>
    <text x="1310" y="362" fill="#bca6f4" font-size="13" letter-spacing="2">S3</text>
  </g>
</svg>
