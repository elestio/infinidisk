[package]
name = "infinidisk2"
version = "0.1.0"
edition = "2024"
publish = false
description = "Linux block storage backed by a local durable WAL and S3 checkpoints"

[dependencies]
anyhow = "1"
bincode = "1.3"
bytes = "1"
clap = { version = "4", features = ["derive"] }
crc32fast = "1"
fs2 = "0.4"
futures = "0.3"
hex = "0.4"
libc = "0.2"
lru = "0.16"
object_store = { version = "=0.14.2", features = ["aws", "fs"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tokio = { version = "1", features = ["full"] }
toml = "0.9"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1", features = ["v4", "serde"] }

[dev-dependencies]
tempfile = "3"

[profile.release]
lto = "thin"
codegen-units = 1
